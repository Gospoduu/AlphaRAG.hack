services:
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: alpharag_kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:17
    container_name: alpharag_postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: "1234567890"
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: alpharag_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: alpharag_backend
    ports:
      - "8000:8000"

    working_dir: /app

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://appuser:1234567890@postgres:5432/mydb
      REDIS_URL: redis://redis:6379/0
      LLM_USER_UUID: d589aeab-e4e5-4746-ab25-607bcd7cb644
      KAFKA_URL: kafka:29092

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    volumes:
      - ./:/app

    command: >
      bash -lc "
      python -m Back.infra.redis.start_redis &&
      python -m Back.infra.db.start_db &&
      uvicorn Back.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  pgdata: