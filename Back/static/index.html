<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WS Chat Console</title>
<style>
  :root{
    --bg:#0a0d12;
    --panel:#12161d;
    --panel-2:#171c24;
    --border:#242b35;
    --border-soft:#1b212a;
    --text:#e3e9f0;
    --muted:#7c8794;
    --muted-2:#4c555f;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --accent-live:#ffb454;
    --accent-user:#5ec9f8;
    --accent-ok:#3ddc84;
    --accent-err:#ff6b6b;
    --radius:10px;
    --radius-lg:14px;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(94,201,248,.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255,180,84,.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .hidden{ display:none !important; }
  ::selection{ background: rgba(94,201,248,.25); }

  code, .mono{ font-family:var(--mono); }

  /* ---------- boot screen ---------- */
  #boot{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .boot-inner{ text-align:center; }
  .boot-dot{
    width:10px; height:10px; margin:0 auto 14px;
    border-radius:50%;
    background:var(--accent-live);
    box-shadow:0 0 0 0 rgba(255,180,84,.6);
    animation: bootpulse 1.1s ease-out infinite;
  }
  @keyframes bootpulse{
    0%{ box-shadow:0 0 0 0 rgba(255,180,84,.55); }
    70%{ box-shadow:0 0 0 14px rgba(255,180,84,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,180,84,0); }
  }
  #bootText{ color:var(--muted); font-family:var(--mono); font-size:13px; letter-spacing:.02em; }

  /* ---------- shell ---------- */
  #app-shell{ max-width:1180px; margin:0 auto; padding:16px 18px 22px; }

  #topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:700; font-size:14px; letter-spacing:.01em;
  }
  .brand .sq{
    width:20px;height:20px;border-radius:6px;
    background:linear-gradient(135deg, var(--accent-user), #2f6fa8);
    flex:none;
  }

  .ws-indicator{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; color:var(--muted); }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--muted-2); flex:none; }
  .ws-indicator[data-status="open"] .dot{ background:var(--accent-ok); box-shadow:0 0 0 3px rgba(61,220,132,.15); }
  .ws-indicator[data-status="connecting"] .dot{ background:var(--accent-live); animation:blink 1s ease-in-out infinite; }
  .ws-indicator[data-status="closed"] .dot,
  .ws-indicator[data-status="error"] .dot{ background:var(--accent-err); }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .chip{
    font-family:var(--mono); font-size:12px; color:var(--muted);
    background:var(--panel-2); border:1px solid var(--border);
    padding:5px 10px; border-radius:999px;
    display:flex; align-items:center; gap:6px;
  }
  .chip b{ color:var(--text); font-weight:600; }
  .role-badge{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    padding:4px 8px; border-radius:6px;
    background:rgba(94,201,248,.1); color:var(--accent-user); border:1px solid rgba(94,201,248,.25);
  }
  .role-badge[data-role="admin"]{
    background:rgba(255,180,84,.1); color:var(--accent-live); border-color:rgba(255,180,84,.3);
  }

  .spacer{ flex:1; }

  button{
    appearance:none; cursor:pointer;
    font-family:var(--sans); font-weight:600; font-size:13px;
    color:var(--text); background:var(--panel-2);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 14px;
    transition: border-color .15s ease, background .15s ease, transform .05s ease;
  }
  button:hover{ border-color:#37414e; background:#1b212b; }
  button:active{ transform:translateY(1px); }
  button.primary{
    background:var(--accent-user); color:#04202e; border-color:transparent;
  }
  button.primary:hover{ background:#7ad4fc; }
  button.ghost{ background:transparent; }
  button.danger{ color:var(--accent-err); }

  /* ---------- layout ---------- */
  #layout{ display:grid; grid-template-columns:290px 1fr; gap:16px; }

  #sidebar, #chat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    min-height:0;
  }
  #sidebar{ padding:14px; }
  #chat{ padding:14px; height: calc(100vh - 140px); min-height: 480px; }

  .panel-title{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted-2); margin:2px 0 10px;
  }

  #chatSelect{
    flex:1;
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-family:var(--mono); font-size:12.5px;
    padding:4px;
    outline:none;
  }
  #chatSelect option{ padding:8px 10px; border-radius:6px; }
  #chatSelect option.streaming{ color:var(--accent-live); font-weight:700; }

  .sidebar-foot{ margin-top:10px; color:var(--muted-2); font-size:11.5px; line-height:1.5; }
  .legend{ display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11.5px; color:var(--muted); }
  .legend .dot{ background:var(--accent-live); animation:blink 1.3s ease-in-out infinite; }

  .chat-head{
    display:flex; align-items:center; gap:10px;
    padding-bottom:12px; margin-bottom:12px;
    border-bottom:1px solid var(--border-soft);
  }
  .chat-head .id{ font-family:var(--mono); font-size:13px; color:var(--muted); }
  .chat-head .id b{ color:var(--text); }

  #messages{
    list-style:none; margin:0; padding:6px 4px;
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; gap:8px;
  }
  #messages::-webkit-scrollbar{ width:9px; }
  #messages::-webkit-scrollbar-thumb{ background:#232a34; border-radius:999px; border:2px solid transparent; background-clip:padding-box; }
  #messages::-webkit-scrollbar-thumb:hover{ background:#2d3542; }

  #messages li{
    max-width:74%;
    padding:9px 12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel-2);
    font-size:13.5px;
    line-height:1.45;
    white-space:pre-wrap;
    word-wrap:break-word;
    box-shadow:0 1px 0 rgba(0,0,0,.15);
  }
  #messages li .role-label{
    display:block; font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted-2); margin-bottom:4px;
  }

  #messages li[data-role="user"]{
    margin-left:auto;
    background:rgba(94,201,248,.09);
    border-color:rgba(94,201,248,.25);
    border-bottom-right-radius:4px;
  }
  #messages li[data-role="user"] .role-label{ color:var(--accent-user); }

  #messages li[data-role="bot"]{
    margin-right:auto;
    border-bottom-left-radius:4px;
  }

  #messages li[data-role="sys"]{
    align-self:center;
    max-width:90%;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--muted);
    font-family:var(--mono);
    font-size:11.5px;
    padding:5px 12px;
    text-align:center;
  }

  #messages li[data-kind="stream"]{
    border-color:rgba(255,180,84,.35);
    background:rgba(255,180,84,.05);
  }
  #messages li[data-kind="stream"] .role-label{ color:var(--accent-live); display:flex; align-items:center; gap:6px; }
  #messages li[data-kind="stream"] .role-label .dot{ background:var(--accent-live); animation:blink 1s ease-in-out infinite; }

  .cursor{
    display:inline-block; width:7px; margin-left:1px;
    color:var(--accent-live);
    animation:blink 0.9s steps(1) infinite;
  }

  .composer{
    display:flex; gap:8px; margin-top:12px;
  }
  #messageInput{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-family:var(--sans); font-size:13.5px;
    padding:10px 12px;
    outline:none;
  }
  #messageInput:focus{ border-color:rgba(94,201,248,.45); box-shadow:0 0 0 3px rgba(94,201,248,.12); }
  #messageInput::placeholder{ color:var(--muted-2); }

  @media (max-width: 860px){
    #layout{ grid-template-columns:1fr; }
    #chat{ height:auto; }
    #messages{ max-height:50vh; }
  }
</style>
</head>
<body>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-dot"></div>
    <p id="bootText" class="mono">инициализация…</p>
  </div>
</div>

<div id="app" class="hidden">
  <div id="app-shell">

    <div id="topbar">
      <div class="brand"><span class="sq"></span>WS Chat Console</div>

      <div class="ws-indicator" id="wsIndicator" data-status="connecting">
        <span class="dot"></span>
        <span id="wsStatusLabel">подключение…</span>
      </div>

      <div class="chip">UUID <b id="uuidChip" class="mono">—</b></div>
      <span class="role-badge" id="roleBadge" data-role="user">user</span>

      <div class="spacer"></div>

      <button class="primary" onclick="createChat()">+ Новый чат</button>
      <button class="ghost danger" onclick="logout()">Выйти</button>
    </div>

    <div id="layout">
      <div id="sidebar">
        <div class="panel-title">Чаты</div>
        <select id="chatSelect" size="14" onchange="onChatSelectChange()"></select>
        <div class="legend"><span class="dot"></span> идёт генерация</div>
        <div class="sidebar-foot">Сессия и незавершённые стримы сохраняются локально — можно переключаться между чатами, ничего не потеряется.</div>
      </div>

      <div id="chat">
        <div class="chat-head">
          <span class="id">Чат <b id="currentChatIdValue">—</b></span>
        </div>

        <ul id="messages"></ul>

        <div class="composer">
          <input type="text" id="messageInput" placeholder="Введите сообщение и нажмите Enter…" />
          <button class="primary" onclick="sendMessage()">Отправить</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
  let userUuid = null;
  let userRole = 'user';
  let socket = null;
  let currentChatId = null;
  let chats = [];

  // chatId -> { text: string, active: boolean }
  const chatStreams = {};
  // chatId -> игнор дублей end_generation
  const endReceivedForChat = {};

  // heartbeat
  let heartbeatIntervalId = null;
  const HEARTBEAT_INTERVAL_MS = 25000;

  // DOM элемент, куда стримим бота (только для активного чата)
  let currentBotMessageEl = null;

  // защита от гонки при быстром переключении чатов
  let loadMessagesToken = 0;

  const LS_USER_KEY = 'alpha_user_uuid';
  const LS_ROLE_KEY = 'alpha_user_role';
  const LS_CHAT_KEY = 'alpha_current_chat_id';
  const LS_STREAM_IDS_KEY = 'alpha_last_entry_ids_v2';
  const LS_GEN_TEXT_KEY = 'alpha_gen_text_v2';
  const LS_GEN_ACTIVE_KEY = 'alpha_gen_active_v2';

  // ---------------- storage helpers ----------------
  function safeParseLS(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
    catch (_) { return fallback; }
  }
  function setLSObj(key, obj) { localStorage.setItem(key, JSON.stringify(obj)); }

  function setLastId(chatId, lastId) {
    if (!chatId || !lastId) return;
    const m = safeParseLS(LS_STREAM_IDS_KEY, {});
    m[String(chatId)] = String(lastId);
    setLSObj(LS_STREAM_IDS_KEY, m);
  }
  function getLastId(chatId) {
    const m = safeParseLS(LS_STREAM_IDS_KEY, {});
    return m[String(chatId)] || null;
  }
  function setGenText(chatId, text) {
    if (!chatId) return;
    const m = safeParseLS(LS_GEN_TEXT_KEY, {});
    m[String(chatId)] = String(text || '');
    setLSObj(LS_GEN_TEXT_KEY, m);
  }
  function getGenText(chatId) {
    const m = safeParseLS(LS_GEN_TEXT_KEY, {});
    return m[String(chatId)] || '';
  }
  function setGenActive(chatId, active) {
    if (!chatId) return;
    const m = safeParseLS(LS_GEN_ACTIVE_KEY, {});
    m[String(chatId)] = !!active;
    setLSObj(LS_GEN_ACTIVE_KEY, m);
  }
  function isGenActive(chatId) {
    const m = safeParseLS(LS_GEN_ACTIVE_KEY, {});
    return !!m[String(chatId)];
  }
  function isChatStreaming(chatId) {
    return isGenActive(chatId) && !!getGenText(chatId);
  }
  function clearGen(chatId) {
    if (!chatId) return;
    setGenText(chatId, '');
    setGenActive(chatId, false);
  }
  function extractLastId(message) {
    return message?.meta?.last_id ?? message?.meta?.stream_id ?? null;
  }

  // ---------------- UI helpers ----------------
  function ensureStreamLine() {
    const list = document.getElementById('messages');
    // защита: если элемент был отсоединён от DOM (например, из-за перерисовки
    // истории во время гонки), пересоздаём его вместо тихого отказа
    if (!currentBotMessageEl || !list.contains(currentBotMessageEl)) {
      currentBotMessageEl = document.createElement('li');
      currentBotMessageEl.dataset.kind = 'stream';
      currentBotMessageEl.dataset.role = 'bot';

      const label = document.createElement('span');
      label.className = 'role-label';
      label.innerHTML = '<span class="dot"></span> bot · live';

      const textSpan = document.createElement('span');
      textSpan.className = 'stream-text';

      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      cursor.textContent = '▌';

      currentBotMessageEl.appendChild(label);
      currentBotMessageEl.appendChild(textSpan);
      currentBotMessageEl.appendChild(cursor);
      list.appendChild(currentBotMessageEl);
    }
  }

  function setStreamText(txt) {
    ensureStreamLine();
    currentBotMessageEl.querySelector('.stream-text').textContent = txt;
  }

  function isNearBottom(list) {
    return list.scrollHeight - list.scrollTop - list.clientHeight < 100;
  }
  function scrollToBottom(force) {
    const list = document.getElementById('messages');
    if (force || isNearBottom(list)) list.scrollTop = list.scrollHeight;
  }

  function renderStreamIfNeeded(chatId) {
    const active = isGenActive(chatId);
    const txt = getGenText(chatId);

    if (!active || !txt) {
      currentBotMessageEl = null;
      return;
    }

    chatStreams[chatId] = { text: txt, active: true };

    if (Number(chatId) !== Number(currentChatId)) return;

    setStreamText(txt);
    scrollToBottom(true);
  }

  function setWsStatus(status) {
    const el = document.getElementById('wsIndicator');
    const label = document.getElementById('wsStatusLabel');
    el.dataset.status = status;
    const map = { connecting: 'подключение…', open: 'на связи', closed: 'офлайн', error: 'ошибка соединения' };
    label.textContent = map[status] || status;
  }

  function setBootText(t) {
    const el = document.getElementById('bootText');
    if (el) el.textContent = t;
  }

  // ---------------- startup ----------------
  document.addEventListener('DOMContentLoaded', async () => {
    const savedUserUuid = localStorage.getItem(LS_USER_KEY);
    const savedChatId = localStorage.getItem(LS_CHAT_KEY);
    const savedRole = localStorage.getItem(LS_ROLE_KEY);

    if (savedUserUuid) {
      userUuid = savedUserUuid;
      userRole = savedRole || 'user';
      await enterApp(savedChatId);
    } else {
      // автоматическое создание пользователя при первом заходе
      setBootText('создаём тестового пользователя…');
      await createUser();
    }
  });

  async function enterApp(savedChatId) {
    document.getElementById('uuidChip').textContent = userUuid;
    const roleBadge = document.getElementById('roleBadge');
    roleBadge.textContent = userRole;
    roleBadge.dataset.role = userRole;

    document.getElementById('boot').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    await fetchChats();

    if (savedChatId && chats.find(c => c.id === Number(savedChatId))) {
      currentChatId = Number(savedChatId);
    } else if (chats.length > 0) {
      currentChatId = chats[0].id;
    }

    if (currentChatId) {
      setCurrentChatId(currentChatId);
      localStorage.setItem(LS_CHAT_KEY, String(currentChatId));
      await loadMessages(currentChatId);
    }

    refreshChatListIndicators();
    connectWebSocket(userUuid);
  }

  // ---------------- heartbeat ----------------
  function startHeartbeat() {
    stopHeartbeat();
    heartbeatIntervalId = setInterval(() => {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ event: 'ping', status: 'ok', data: { user_uuid: userUuid } }));
    }, HEARTBEAT_INTERVAL_MS);
  }
  function stopHeartbeat() {
    if (heartbeatIntervalId !== null) {
      clearInterval(heartbeatIntervalId);
      heartbeatIntervalId = null;
    }
  }

  // ---------------- websocket ----------------
  function connectWebSocket(userUuid) {
    const wsUrl = `ws://localhost:8000/api/ws/${userUuid}`;

    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
      try { socket.close(); } catch (_) {}
    }

    setWsStatus('connecting');
    socket = new WebSocket(wsUrl);

    socket.onopen = function () {
      setWsStatus('open');
      displayMessage('WS: соединение установлено');
      startHeartbeat();
      if (currentChatId) renderStreamIfNeeded(currentChatId);
    };

    socket.onmessage = function (event) {
      const message = JSON.parse(event.data);

      switch (message.event.toLowerCase()) {
        case 'new_token':
          handleNewToken(message);
          break;
        case 'end_generation':
          handleEndGeneration(message);
          break;
        case 'generated_text':
          handleGeneratedText(message);
          break;
        case 'pong':
          break;
        case 'error':
          displayMessage(`❌ ERROR: ${message.data?.details ?? 'unknown error'}`);
          if (currentChatId) clearGen(currentChatId);
          currentBotMessageEl = null;
          refreshChatListIndicators();
          break;
        default:
          break;
      }
    };

    socket.onerror = function () {
      setWsStatus('error');
      displayMessage('WS: ошибка, см. консоль');
    };

    socket.onclose = function () {
      setWsStatus('closed');
      displayMessage('WS: соединение закрыто');
      currentBotMessageEl = null;
      stopHeartbeat();
    };
  }

  // ---------------- stream handlers ----------------
  function handleNewToken(message) {
    const data = message.data || {};
    const chatId = Number(data.chat_id);
    const token = data.token ?? '';

    const lastId = extractLastId(message);
    if (lastId) setLastId(chatId, lastId);

    const prev = getGenText(chatId);
    const next = prev + token;
    setGenText(chatId, next);
    setGenActive(chatId, true);

    chatStreams[chatId] = { text: next, active: true };
    endReceivedForChat[chatId] = false;

    refreshChatListIndicators();

    if (chatId !== Number(currentChatId)) return;
    setStreamText(next);
    scrollToBottom(false);
  }

  function handleGeneratedText(message) {
    const data = message.data || {};
    const chatId = Number(data.chat_id);
    const text = data.text ?? '';

    const lastId = extractLastId(message);
    if (lastId) setLastId(chatId, lastId);

    const cur = getGenText(chatId);
    const chosen = (cur && cur.length >= text.length && cur.startsWith(text)) ? cur : text;

    setGenText(chatId, chosen);
    setGenActive(chatId, true);
    chatStreams[chatId] = { text: chosen, active: true };

    refreshChatListIndicators();

    if (chatId !== Number(currentChatId)) return;
    setStreamText(chosen);
    scrollToBottom(false);
  }

  function handleEndGeneration(message) {
    const data = message.data || {};
    const chatId = Number(data.chat_id);

    if (endReceivedForChat[chatId]) return;
    endReceivedForChat[chatId] = true;

    clearGen(chatId);
    if (chatStreams[chatId]) chatStreams[chatId].active = false;

    refreshChatListIndicators();

    if (chatId === Number(currentChatId)) {
      currentBotMessageEl = null;
    }
  }

  // ---------------- chats api ----------------
  async function fetchChats() {
    if (!userUuid) return;
    const url = `http://localhost:8000/api/chat/${userUuid}/chats`;
    const response = await fetch(url);
    const data = await response.json();
    if (data.status === 'ok') {
      chats = data.chats || [];
      renderChatList();
    }
  }

  function renderChatList() {
    const select = document.getElementById('chatSelect');
    select.innerHTML = '';

    if (!chats.length) {
      const opt = document.createElement('option');
      opt.textContent = 'Чатов нет — создайте первый';
      opt.disabled = true;
      select.appendChild(opt);
      return;
    }

    chats.forEach(chat => {
      const opt = document.createElement('option');
      opt.value = chat.id;
      const streaming = isChatStreaming(chat.id);
      opt.textContent = `${streaming ? '● ' : ''}#${chat.id} — ${chat.title || 'Без названия'}`;
      opt.classList.toggle('streaming', streaming);
      if (currentChatId && chat.id === currentChatId) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function refreshChatListIndicators() {
    const select = document.getElementById('chatSelect');
    Array.from(select.options).forEach(opt => {
      const id = Number(opt.value);
      if (!id) return;
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      const streaming = isChatStreaming(id);
      opt.classList.toggle('streaming', streaming);
      opt.textContent = `${streaming ? '● ' : ''}#${chat.id} — ${chat.title || 'Без названия'}`;
    });
  }

  async function onChatSelectChange() {
    const select = document.getElementById('chatSelect');
    const value = select.value;
    if (!value) return;

    currentChatId = Number(value);
    setCurrentChatId(currentChatId);
    localStorage.setItem(LS_CHAT_KEY, String(currentChatId));

    await loadMessages(currentChatId);
  }

  async function loadMessages(chatId) {
    const myToken = ++loadMessagesToken;
    currentBotMessageEl = null;

    const url = `http://localhost:8000/api/chat/${chatId}/messages?start_message_idx=0&batch_size=40`;
    const response = await fetch(url);
    const data = await response.json();

    // если пока грузили — пользователь уже переключился на другой чат, отбрасываем
    if (myToken !== loadMessagesToken || Number(chatId) !== Number(currentChatId)) return;

    if (data.status !== 'ok') {
      displayMessage(`Не удалось загрузить сообщения для чата ${chatId}`);
      return;
    }

    let msgs = data.messages || [];
    msgs = msgs.reverse();

    const list = document.getElementById('messages');
    list.innerHTML = '';

    msgs.forEach(msg => {
      const li = document.createElement('li');
      const role = (msg.user_role || 'user').toLowerCase() === 'user' ? 'user' : 'bot';
      li.dataset.role = role;

      const roleLabel = document.createElement('span');
      roleLabel.className = 'role-label';
      roleLabel.textContent = role;

      const textSpan = document.createElement('span');
      textSpan.textContent = msg.text ?? '';

      li.appendChild(roleLabel);
      li.appendChild(textSpan);
      list.appendChild(li);
    });

    scrollToBottom(true);

    // дорисовать незавершённый стрим (если есть) поверх истории
    renderStreamIfNeeded(chatId);
  }

  function setCurrentChatId(chatId) {
    currentChatId = chatId;
    document.getElementById('currentChatIdValue').textContent = chatId;
  }

  // ---------------- create user/chat ----------------
  async function createUser() {
    const params = new URLSearchParams(location.search);
    const role = params.get('role') === 'admin' ? 'admin' : 'user';

    const response = await fetch('http://localhost:8000/api/user/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role })
    });

    const data = await response.json();

    if (data.status === 'ok') {
      userUuid = data.uuid;
      userRole = role;
      localStorage.setItem(LS_USER_KEY, userUuid);
      localStorage.setItem(LS_ROLE_KEY, userRole);

      setBootText('готово, открываем чат…');
      await enterApp(null);
    } else {
      setBootText('ошибка при создании пользователя — обновите страницу');
    }
  }

  async function createChat() {
    if (!userUuid) return;

    const response = await fetch('http://localhost:8000/api/chat/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_uuid: userUuid })
    });

    const data = await response.json();

    if (data.status === 'ok') {
      await fetchChats();

      currentChatId = data.chat_id;
      setCurrentChatId(currentChatId);
      localStorage.setItem(LS_CHAT_KEY, String(currentChatId));

      const select = document.getElementById('chatSelect');
      if (select) select.value = String(currentChatId);

      displayMessage(`Чат создан: id=${currentChatId}`);
      await loadMessages(currentChatId);
    } else {
      alert('Ошибка при создании чата');
    }
  }

  // ---------------- send message ----------------
  function sendMessage() {
    const messageInput = document.getElementById('messageInput');
    const text = messageInput.value.trim();
    if (!text) return;

    if (!socket || socket.readyState !== WebSocket.OPEN) {
      alert('WebSocket ещё не подключен');
      return;
    }
    if (!currentChatId) {
      alert('Сначала выберите или создайте чат');
      return;
    }

    socket.send(JSON.stringify({
      event: 'new_message',
      status: 'ok',
      data: { user_uuid: userUuid, chat_id: currentChatId, text, answered_to: null, role: 'user' }
    }));

    displayMessage(`YOU: ${text}`);
    messageInput.value = '';

    setGenText(currentChatId, '');
    setGenActive(currentChatId, true);
    chatStreams[currentChatId] = { text: '', active: true };
    endReceivedForChat[currentChatId] = false;
    currentBotMessageEl = null;
    refreshChatListIndicators();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.activeElement?.id === 'messageInput') {
      e.preventDefault();
      sendMessage();
    }
  });

  // ---------------- display message (system / meta) ----------------
  function displayMessage(message) {
    const messageList = document.getElementById('messages');
    if (!messageList) return;

    const isUser = (typeof message === 'string' && message.startsWith('YOU:'));

    const li = document.createElement('li');
    li.dataset.kind = 'msg';
    li.dataset.role = isUser ? 'user' : 'sys';

    if (isUser) {
      const roleLabel = document.createElement('span');
      roleLabel.className = 'role-label';
      roleLabel.textContent = 'user';
      li.appendChild(roleLabel);
    }

    const textSpan = document.createElement('span');
    textSpan.textContent = isUser ? message.replace(/^YOU:\s*/, '') : message;
    li.appendChild(textSpan);

    messageList.appendChild(li);
    scrollToBottom(true);
  }

  // ---------------- logout ----------------
  function logout() {
    localStorage.removeItem(LS_USER_KEY);
    localStorage.removeItem(LS_ROLE_KEY);
    localStorage.removeItem(LS_CHAT_KEY);

    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
      try { socket.close(); } catch (_) {}
    }

    userUuid = null;
    currentChatId = null;
    chats = [];

    document.getElementById('app').classList.add('hidden');
    document.getElementById('boot').classList.remove('hidden');
    setBootText('создаём тестового пользователя…');

    document.getElementById('messages').innerHTML = '';
    document.getElementById('chatSelect').innerHTML = '';

    createUser();
  }

  // expose for inline handlers
  window.createChat = createChat;
  window.logout = logout;
  window.sendMessage = sendMessage;
  window.onChatSelectChange = onChatSelectChange;
</script>
</body>
</html>
